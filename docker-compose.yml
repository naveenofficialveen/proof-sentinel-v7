services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: proof
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: proof
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proof -d proof"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - evidence:/data/evidence
    ports:
      - "8000:8000"
    restart: on-failure

  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - evidence:/data/evidence
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  evidence:
